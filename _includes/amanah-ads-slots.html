<!-- Example ad placements: paste into your templates where appropriate -->

<!-- Top leaderboard (desktop) -->
<div class="ad-container ad-desktop-centered" role="complementary" aria-label="Advertisement - leaderboard">
  <div
    id="amanah-ad-banner-leaderboard"
    class="amanah-ad-slot"
    data-type="BANNER"
    data-size="LEADERBOARD"
    aria-hidden="true">
  </div>
</div>

<!-- Inline article medium rectangle (shows on desktop/tablet, hidden on small phones) -->
<div class="ad-container ad-inline" role="complementary" aria-label="Advertisement - medium rectangle">
  <div
    id="amanah-ad-banner-medium_rectangle"
    class="amanah-ad-slot"
    data-type="BANNER"
    data-size="MEDIUM_RECTANGLE"
    aria-hidden="true">
  </div>
</div>

<!-- Mobile bottom banner — recommended as sticky only if you add content padding (see JS) -->
<div class="ad-container ad-mobile-sticky" role="complementary" aria-label="Advertisement - mobile banner">
  <div
    id="amanah-ad-banner-mobile_banner"
    class="amanah-ad-slot"
    data-type="BANNER"
    data-size="MOBILE_BANNER"
    aria-hidden="true">
  </div>
</div>

<!-- Optional video slots (place where video is allowed and visible) -->
<div class="ad-container ad-desktop-centered" role="complementary" aria-label="Advertisement - video leaderboard">
  <div
    id="amanah-ad-video-leaderboard"
    class="amanah-ad-slot"
    data-type="VIDEO"
    data-size="LEADERBOARD"
    aria-hidden="true">
  </div>
</div>

<div class="ad-container ad-mobile-only" role="complementary" aria-label="Advertisement - video mobile banner">
  <div
    id="amanah-ad-video-mobile_banner"
    class="amanah-ad-slot"
    data-type="VIDEO"
    data-size="MOBILE_BANNER"
    aria-hidden="true">
  </div>
</div>
