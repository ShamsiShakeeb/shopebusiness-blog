<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: "Shop-E-Business Blog" }}</title>
  <style>
      * {
          box-sizing: border-box;
      }
      body {
          margin: 0;
          padding: 12px;
          background-color: #f8fafc;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          color: #334155;
          line-height: 1.7;
      }
      .blog-container {
          width: 100%;
          max-width: 850px;
          margin: 0 auto;
          background: #fff;
          padding: 20px;
          border-radius: 12px;
          box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      }
      @media (min-width: 768px) {
          body {
              padding: 40px;
          }
          .blog-container {
              padding: 45px;
          }
      }
      .video-container {
          position: relative;
          width: 100%;
          padding-bottom: 56.25%;
          height: 0;
          margin: 25px 0;
          border-radius: 10px;
          overflow: hidden;
          box-shadow: 0 6px 20px rgba(0,0,0,0.08);
          background: #000;
      }
      .video-container iframe {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          border: 0;
      }
  </style>
</head>
<body>

  <!-- Your Blog Post Content Injected Here -->
  {{ content }}

  <!-- Infolinks Global Script -->
  <script type="text/javascript">
      var infolinks_pid = 3447398;
      var infolinks_wsid = 0;
  </script>
  <script type="text/javascript" src="https://resources.infolinks.com/js/infolinks_main.js" async></script>
</body>
</html>
