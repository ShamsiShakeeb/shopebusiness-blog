layout: default
title: All Blogs
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shop-E-Business Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
  <div class="container">
    <h1 class="mb-4">Shop-E-Business Blog Posts</h1>
    <div class="row">
      {% for post in site.posts %}
        <div class="col-md-6 mb-4">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h3 class="card-title">
                <a href="/blog{{ post.url }}" class="text-decoration-none text-dark">{{ post.title }}</a>
              </h3>
              <p class="text-muted small">{{ post.date | date: "%B %d, %Y" }}</p>
              <p class="card-text">{{ post.excerpt | strip_html | truncatewords: 25 }}</p>
              <a href="/blog{{ post.url }}" class="btn btn-sm btn-primary">Read More &rarr;</a>
            </div>
          </div>
        </div>
      {% endfor %}
    </div>
  </div>
</body>
</html>
